[project]
name = "aperture-agent"
version = "0.1.0"
description = "Aperture AI interviewer voice agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents[openai,anthropic,deepgram,cartesia,elevenlabs,silero,turn-detector,google]~=1.8",
  "python-dotenv",
  "httpx",
  "playwright",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
